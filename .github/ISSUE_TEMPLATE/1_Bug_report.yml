name: Bug Report
description: "Report a general library issue."
body:
  - type: markdown
    attributes:
      value: "Please read [our full contribution guide](https://laraxgram.github.io/contributions.html#bug-reports) before submitting bug reports. If you notice improper DocBlock or IDE warnings while using LaraGram, do not create a GitHub issue. Instead, please submit a pull request to fix the problem."
  - type: input
    attributes:
      label: LaraGram Package Version
      description: Provide the LaraGram Package version that you are using.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    attributes:
      label: LaraGram Version
      description: Provide the LaraGram version that you are using. [Please ensure it is still supported.](https://laraxgram.github.io/releases.html#support-policy)
      placeholder: 3.0.0
    validations:
      required: true
  - type: input
    attributes:
      label: PHP Version
      description: Provide the PHP version that you are using.
      placeholder: 8.1.4
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Operating System
      description: What operating system are you using? Any OS not listed here is currently not supported.
      options:
        - macOS
        - Windows (WSL)
        - Linux
    validations:
      required: true
  - type: input
    attributes:
      label: OS Version
      description: Provide the operation version
      placeholder: 8.1.4
    validations:
      required: true
  - type: textarea
    attributes:
      label: Description
      description: Provide a detailed description of the issue you are facing.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: Provide detailed steps to reproduce your issue. If necessary, please provide a GitHub repository to demonstrate your issue using `laragram new bug-report --github="--public"`.
    validations:
      required: true
