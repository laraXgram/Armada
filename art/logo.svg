      <rect x="24" y="42.6" width="5" height="4.6" rx="1"/>
      <rect x="31" y="42.6" width="5" height="4.6" rx="1"/>
      <rect x="38" y="42.6" width="5" height="4.6" rx="1"/>
      <rect x="45" y="42.6" width="5" height="4.6" rx="1"/>
    </g>

    <!-- Sea -->
    <path fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round" d="M6 57.8 q4.3 -3.2 8.6 0 t8.6 0 t8.6 0 t8.6 0 t8.6 0 t8.6 0"/>
  </g>
