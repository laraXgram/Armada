<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 64" role="img" aria-label="LaraGram Armada">
  <style>
    .armada-word { fill: #171c9c; }
    @media (prefers-color-scheme: dark) { .armada-word { fill: #ffffff; } }
  </style>
  <defs>
    <linearGradient id="armada-sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171c9c"/>
      <stop offset="1" stop-color="#2aabee"/>
